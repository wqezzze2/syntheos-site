name: Publish Hidden Tile Hook to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '15 8 * * 1,3,5'
permissions:
  contents: read
  pages: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: unzip -q site-source.zip -d .site-source
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: .site-source/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: .site-source
      - uses: actions/configure-pages@v5
      - run: npm run build
        working-directory: .site-source
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .site-source/_site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
